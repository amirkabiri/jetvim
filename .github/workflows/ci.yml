name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    name: Editor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      JETVIM_DISABLE_VCS: '1'
      JETVIM_DISABLE_AUTOSAVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Public source and generated files
        run: |
          python3 scripts/public-audit.py
          python3 tests/public_audit.py
          python3 scripts/generate.py --check
          python3 -c 'import ast,pathlib; [ast.parse(p.read_text(),filename=str(p)) for d in ("scripts","tests") for p in pathlib.Path(d).glob("*.py")]'
          for file in jetvim scripts/setup-typescript.sh scripts/setup-gopls.sh; do sh -n "$file"; done
          for file in install.sh scripts/package.sh; do bash -n "$file"; done
      - name: Installer unit tests
        run: python3 scripts/ci.py installer
      - name: Install pinned local editor dependencies
        shell: bash
        run: |
          export JETVIM_HOME="$PWD/.jetvim/ci-home"
          export JETVIM_SOURCE_DIR="$PWD"
          export JETVIM_BIN_DIR="$JETVIM_HOME/bin"
          export JETVIM_SKIP_LANGUAGES=1
          bash install.sh
          echo "$JETVIM_HOME/tools/neovim/bin" >> "$GITHUB_PATH"
          echo "$JETVIM_HOME/tools/ripgrep/bin" >> "$GITHUB_PATH"
      - name: Editor and terminal input tests
        run: python3 scripts/ci.py core
      - name: Real Git fixtures
        run: python3 scripts/ci.py git
      - name: Compile and check macOS bridge
        if: runner.os == 'macOS'
        run: |
          mkdir -p .jetvim/bin .jetvim/cache/swift .jetvim/tmp
          TMPDIR="$PWD/.jetvim/tmp" swiftc -module-cache-path "$PWD/.jetvim/cache/swift" macos/KeyBridge.swift -o .jetvim/bin/keybridge-ci
          JETVIM_KEYBRIDGE_CHECKER="$PWD/.jetvim/bin/keybridge-ci" python3 tests/fn_bridge.py
      - name: Verify public archive
        run: python3 tests/package.py
  language-servers:
    name: Language servers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      JETVIM_DISABLE_VCS: '1'
      JETVIM_DISABLE_AUTOSAVE: '1'
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install pinned local editor dependencies
        shell: bash
        run: |
          export JETVIM_HOME="$PWD/.jetvim/ci-home"
          export JETVIM_SOURCE_DIR="$PWD"
          export JETVIM_BIN_DIR="$JETVIM_HOME/bin"
          export JETVIM_SKIP_LANGUAGES=1
          bash install.sh
          echo "$JETVIM_HOME/tools/neovim/bin" >> "$GITHUB_PATH"
          echo "$JETVIM_HOME/tools/ripgrep/bin" >> "$GITHUB_PATH"
      - name: Install actual TypeScript and Go language servers
        run: |
          sh scripts/setup-typescript.sh
          sh scripts/setup-gopls.sh
      - name: Verify attachment and declaration navigation
        run: python3 scripts/ci.py languages
